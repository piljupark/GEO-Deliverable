services:
  - type: web
    name: signal-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # 선택 항목: API 키 없이도 작동하지만, 키를 넣으면 더 많이 호출 가능
      - key: PAGESPEED_API_KEY
        sync: false
      # 무료 발급: aistudio.google.com/apikey (카드 불필요). /analyze의 AI 노출 체크에 사용
      - key: GEMINI_API_KEY
        sync: false
